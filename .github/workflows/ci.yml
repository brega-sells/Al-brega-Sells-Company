name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-syntax.mjs

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tests/package.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Run rules tests
        working-directory: tests
        run: npm run rules

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tests/package.json }
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: (python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &) && sleep 1
      - name: Run browser tests
        working-directory: tests
        env: { NODE_PATH: ${{ github.workspace }}/tests/node_modules }
        run: npm run browser
