<style>
/* Layout: fixed ink sidebar (right, RTL) + working canvas; tables are the core surface, cards only for KPIs and record drawers */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#f7f9fb; --ink:#13263a; --muted:#5d6d7e; --line:#dce3ea; --line2:#e9eef3;
  --accent:#0b5c8a; --accent-soft:#e3eff7; --flame:#c4501f; --flame-soft:#fbeee7;
  --side:#0f2236; --side-ink:#d7e2ec; --side-muted:#8ea3b8; --side-hi:#18324d;
  --ok:#1d7a4c; --ok-soft:#e3f3ea; --warn:#a86a0c; --warn-soft:#fbf1dd; --crit:#b42318; --crit-soft:#fbe7e5; --info:#3a55c4; --info-soft:#e7ebfb; --neutral:#667585; --neutral-soft:#edf0f3;
  --shadow:0 1px 2px rgba(15,34,54,.06),0 4px 16px rgba(15,34,54,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c151e; --surface:#132130; --surface2:#172738; --ink:#e3eaf1; --muted:#97a8b9; --line:#24384c; --line2:#1d2f41;
  --accent:#63b3e3; --accent-soft:#16344b; --flame:#f08350; --flame-soft:#3a2219;
  --side:#08111a; --side-ink:#d7e2ec; --side-muted:#7f94a9; --side-hi:#132538;
  --ok:#4fc58a; --ok-soft:#173527; --warn:#e2a948; --warn-soft:#3a2d14; --crit:#f2766b; --crit-soft:#3d1c1a; --info:#8ea2f5; --info-soft:#1e2647; --neutral:#9aa8b6; --neutral-soft:#1f2c3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151e; --surface:#132130; --surface2:#172738; --ink:#e3eaf1; --muted:#97a8b9; --line:#24384c; --line2:#1d2f41;
  --accent:#63b3e3; --accent-soft:#16344b; --flame:#f08350; --flame-soft:#3a2219;
  --side:#08111a; --side-ink:#d7e2ec; --side-muted:#7f94a9; --side-hi:#132538;
  --ok:#4fc58a; --ok-soft:#173527; --warn:#e2a948; --warn-soft:#3a2d14; --crit:#f2766b; --crit-soft:#3d1c1a; --info:#8ea2f5; --info-soft:#1e2647; --neutral:#9aa8b6; --neutral-soft:#1f2c3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}a.btn{text-decoration:none;color:inherit}
#login{position:fixed;inset:0;z-index:100;background:var(--side);display:grid;place-items:center;padding:16px;overflow:auto}
.lg-card{width:min(420px,100%);background:var(--surface);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:6px}.lg-brand h1{font-family:var(--f-display);font-size:17px;margin:0}.lg-brand small{color:var(--muted);font-size:12px}
.lg-card input{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding-inline:10px}
.lg-msg{color:var(--crit);font-size:13px;min-height:1em}.lg-foot{margin:0;color:var(--muted);font-size:12px;text-align:center}.lg-foot a{color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;border-inline-start:1px solid var(--line);padding-inline-start:10px}
.who-name{font-weight:600}.who-role{color:var(--muted)}
@media (max-width:900px){.who-name,.who-role{display:none}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding-block:20px;padding-inline:14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding-inline:6px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(160deg,#1a6fa3,#0b3f63);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand h1{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;line-height:1.35}
.brand small{display:block;color:var(--side-muted);font-size:11.5px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;color:var(--side-muted);letter-spacing:.04em;padding:10px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);font-size:13.5px}
.nav button:hover{background:var(--side-hi)}
.nav button[aria-current="true"]{background:var(--side-hi);color:#fff;box-shadow:inset -3px 0 0 #3ea0dc}
.nav button:focus-visible{outline:2px solid #3ea0dc}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-inline-start:auto;font-size:11.5px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding-inline:8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--neutral);margin-inline-end:6px}
.dot.on{background:#3fc380}.dot.off{background:#e5534b}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding-inline:38px 12px}
.search svg{position:absolute;right:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.search kbd{position:absolute;left:10px;top:9px;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface2)}
.sr{position:absolute;top:46px;inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:70vh;overflow:auto;z-index:20}
.sr h6{margin:0;padding:8px 14px 4px;font-size:11.5px;color:var(--muted);font-weight:500}
.sr button{all:unset;display:block;width:100%;box-sizing:border-box;padding:7px 14px;cursor:pointer}
.sr button:hover,.sr button.act{background:var(--accent-soft)}
.sr b{font-weight:600}.sr span{color:var(--muted);font-size:12px;margin-inline-start:8px}
.top-actions{display:flex;gap:8px;margin-inline-start:auto}
.content{padding-block:22px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding-inline:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062033}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#062033}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding-inline:10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:start;transition:border-color .15s}
.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}.kpi.fl .v{color:var(--flame)}
.section-title{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.section-title small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:5px}
.bar-row .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:3ch;text-align:left}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col .c{width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.col .c.hot{background:var(--flame)}
.col .cv{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-labels{display:flex;gap:6px}
.col-labels span{flex:1;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.fuel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fuel{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface2)}
.fuel .l{font-size:12px;color:var(--muted)}.fuel .v{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.fuel .u{font-size:11.5px;color:var(--muted)}
/* toolbar & table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1;min-width:200px;position:relative}
.toolbar input[type=search],.field input,.field select,.field textarea,.toolbar select{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding-inline:10px;min-width:0}
.toolbar input[type=search]{width:100%;padding-inline:34px 10px}
.toolbar .grow svg{position:absolute;right:10px;top:9px;width:17px;height:17px;color:var(--muted)}
.toolbar select{max-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .k{opacity:.7;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 250px);min-height:200px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
td.wrap{white-space:normal;min-width:200px;max-width:340px}
th{position:sticky;top:0;background:var(--surface2);font-weight:600;font-size:12.5px;color:var(--muted);z-index:1;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th[data-sort]::after{content:"";display:inline-block;width:0;margin-inline-start:4px}
th.asc::after{content:"▲";font-size:9px}th.desc::after{content:"▼";font-size:9px}
th.nosort{cursor:default}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
td.n{text-align:left;direction:ltr}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:600;border-top:1px solid var(--line)}
.t-strong{font-weight:600}
.t-muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-info{background:var(--info-soft);color:var(--info)}.p-neutral{background:var(--neutral-soft);color:var(--neutral)}.p-fl{background:var(--flame-soft);color:var(--flame)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--line2);color:var(--muted)}
.tag.link{background:var(--accent-soft);color:var(--accent)}
.tag.dup{background:var(--crit-soft);color:var(--crit)}
.count-line{font-size:12.5px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,18,28,.45);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(620px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer-head{padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-head h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.4;text-wrap:balance}
.drawer-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.drawer-body{overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:16px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.dl div{background:var(--surface);padding:9px 12px;min-width:0}
.dl dt{font-size:11.5px;color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.dl .full{grid-column:1/-1}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
.tl .d{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;min-width:86px}
.progress{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.articles{display:flex;flex-direction:column;gap:6px;counter-reset:a}
.articles details{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 12px}
.articles summary{cursor:pointer;font-weight:500}
.articles p{margin:6px 0 0;color:var(--muted);font-size:13px}
/* modal */
dialog{border:none;border-radius:14px;padding:0;width:min(860px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,18,28,.5)}
.m-head{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.m-head h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.m-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.m-foot{padding:12px 20px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;position:sticky;bottom:0}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surface)}
legend{font-family:var(--f-display);font-weight:600;font-size:13.5px;padding-inline:6px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field label .req{color:var(--crit)}
.field textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.field.full{grid-column:1/-1}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .hint.bad{color:var(--crit)}
.calc{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px;grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px}
.calc b{color:var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;z-index:60;font-size:13.5px;box-shadow:var(--shadow)}
.banner{border-radius:10px;padding:12px 16px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:13.5px}
.banner.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.alerts{display:flex;flex-direction:column}
.alert-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.alert-row:last-child{border-bottom:none}
.alert-row:hover{background:var(--accent-soft)}
.alert-row .days{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;min-width:58px;text-align:center;border-radius:7px;padding:3px 0;font-size:13px}
.alert-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-row .nm small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}

<script>
/* ===== Firebase adapter: shared data in Firestore, sign-in with Firebase Authentication ===== */
(function(){

const ALL=['contracts','needs','batches','extensions','letters','companies','config'];
const ROLE_AR={admin:'مدير النظام',editor:'محرر',viewer:'مشاهد'};
window.__roleAr=ROLE_AR;
let ME=null,FB=null,FS=null,AUTH=null,readyResolve;const ready=new Promise(r=>readyResolve=r);
const cfg=window.FIREBASE_CONFIG;
function screen(html){let o=document.getElementById('login');if(!o){o=document.createElement('div');o.id='login';document.body.appendChild(o)}o.hidden=false;o.innerHTML=html;return o}
function hide(){const o=document.getElementById('login');if(o)o.hidden=true}
const BRAND=`<div class="lg-brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2c2.6 3.6 5 6.6 5 10a5 5 0 0 1-10 0c0-2 .9-3.6 2.2-5.1.2 1.6 1 2.7 2.3 3.2C11 7.8 11.2 4.9 12 2Z" fill="#f08350"/><path d="M12 13.5c1 1.1 1.8 2 1.8 3.1a1.8 1.8 0 0 1-3.6 0c0-1.1.8-2 1.8-3.1Z" fill="#ffd9a8"/></svg></div><div><h1>منظومة العقود والاحتياجات</h1><small>وزارة الصناعة والمعادن · شركة البريقة لتسويق النفط</small></div></div>`;
if(!cfg||!cfg.projectId||/YOUR_/.test(cfg.apiKey||'')){
  screen(`<div class="lg-card">${BRAND}<p style="margin:0">لم يُضبط الاتصال بقاعدة البيانات بعد.</p><p class="muted" style="margin:0;font-size:13px">افتح الملف <b dir="ltr">firebase-config.js</b> والصق فيه إعدادات مشروع Firebase كما في دليل التشغيل، ثم ارفع الملف من جديد.</p></div>`);
  window.appRuntime={use:async()=>null};return;
}
if(!window.firebase){screen(`<div class="lg-card">${BRAND}<p style="margin:0">تعذّر تحميل مكتبة Firebase. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</p></div>`);window.appRuntime={use:async()=>null};return}
FB=firebase.initializeApp(cfg);AUTH=firebase.auth();FS=firebase.firestore();
try{FS.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const L={},DL={},CACHE={};
function snap(col){const m=CACHE[col]||new Map();const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d,metadata:{}}));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}}
function emitDoc(col,id){const d=(CACHE[col]||new Map()).get(id);(DL[col+'/'+id]||[]).forEach(f=>f({id,exists:!!d,data:()=>d,metadata:{}}))}
function emit(col){(L[col]||[]).forEach(f=>{try{f(snap(col))}catch(e){console.error(e)}});Object.keys(DL).forEach(p=>{if(p.split('/')[0]===col)emitDoc(col,p.split('/')[1])})}
const SUBS={};
function subscribe(col){if(SUBS[col])return;SUBS[col]=FS.collection(col).onSnapshot(qs=>{const m=new Map();qs.forEach(d=>m.set(d.id,d.data()));CACHE[col]=m;emit(col)},err=>{console.warn(col,err);if(err.code==='permission-denied'){setConn('لا تملك صلاحية قراءة البيانات')}})}
function setConn(txt,ok){const d=document.getElementById('conn-dot'),t=document.getElementById('conn-txt');if(!d)return;d.className='dot '+(ok?'on':'off');t.textContent=txt}
async function logAct(action,col,id,summary){try{await FS.collection('log').add({ts:new Date().toISOString(),user:ME.email,name:ME.name||'',action,col,id,summary:summary||''})}catch(e){}}
function summarize(col,d){if(!d)return'';if(col==='contracts')return (d.no||'')+' — '+(d.company||'');if(col==='needs')return d.company||'';if(col==='batches')return d.name||'';if(col==='extensions'||col==='letters')return 'عقد '+(d.contractNo||'');if(col==='config')return 'الإعدادات';return d.name||''}
function werr(e){if(e&&e.code==='permission-denied')return {code:'invalid_argument',message:'لا تملك صلاحية الحفظ'};return {code:'unavailable',message:(e&&e.message)||'تعذّر الحفظ'}}
function ref(col,id){return {id,path:col+'/'+id,
  set:async d=>{const existed=(CACHE[col]||new Map()).has(id);try{await FS.collection(col).doc(id).set(JSON.parse(JSON.stringify(d)))}catch(e){throw werr(e)}logAct(existed?'تعديل':'إضافة',col,id,summarize(col,d))},
  update:async d=>{try{await FS.collection(col).doc(id).set(d,{merge:true})}catch(e){throw werr(e)}logAct('تعديل',col,id,summarize(col,d))},
  delete:async()=>{const old=(CACHE[col]||new Map()).get(id);try{await FS.collection(col).doc(id).delete()}catch(e){throw werr(e)}logAct('حذف',col,id,summarize(col,old))},
  get:async()=>{const d=(CACHE[col]||new Map()).get(id);return {id,exists:!!d,data:()=>d}},
  onSnapshot(n){subscribe(col);(DL[col+'/'+id]||(DL[col+'/'+id]=[])).push(n);if(CACHE[col])setTimeout(()=>emitDoc(col,id),0);return()=>{}}}}

window.appRuntime={use:async n=>{await ready;return {db,user,downloads}[n]||null}};
window.__me=()=>ME;window.__fs=()=>FS;window.__auth=()=>AUTH;
window.__seedIfEmpty=async function(){const seedEl=document.getElementById('seed-data');if(!seedEl)return 0;const s=JSON.parse(seedEl.textContent);let n=0;let batch=FS.batch(),k=0;
  for(const col of Object.keys(s)){for(const o of s[col]){const d=Object.assign({},o);const id=d.id;delete d.id;batch.set(FS.collection(col).doc(id),d);n++;k++;if(k>=400){await batch.commit();batch=FS.batch();k=0}}}

function authErr(e){const m={'auth/invalid-email':'البريد الإلكتروني غير صحيح','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/wrong-password':'كلمة المرور غير صحيحة','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/invalid-login-credentials':'البريد أو كلمة المرور غير صحيحة','auth/email-already-in-use':'هذا البريد مسجّل مسبقًا، سجّل الدخول','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كثيرة، انتظر قليلًا','auth/network-request-failed':'تعذّر الاتصال بالإنترنت','auth/unauthorized-domain':'هذا النطاق غير مُصرّح به في إعدادات Firebase (Authorized domains)','auth/operation-not-allowed':'تسجيل الدخول بالبريد غير مفعّل في Firebase'};return m[e.code]||(e.message||'حدث خطأ')}
function showLogin(mode){
  const reg=mode==='register';
  const o=screen(`<form class="lg-card" novalidate>${BRAND}

    <div class="field"><label for="lg-u">البريد الإلكتروني</label><input id="lg-u" type="email" autocomplete="username" dir="ltr"></div>

};

/* ============ State ============ */

  settings:{t1:90,t2:60,t3:30,types:['بيع وقود الديزل','بيع منتج الزيت الثقيل','بيع منتج غاز مسال','بيع وقود السفن','بيع البنزين','توريد منتجات نفطية','تقديم خدمات','صيانة','نقل وتشغيل'],depts:['إدارة المبيعات','الإدارة التجارية','الإدارة الفنية','الشؤون القانونية','إدارة العقود والتوثيق'],specials:['معلق','منتهٍ قبل موعده'],currencies:['دينار ليبي','دولار أمريكي','يورو']},
  settingsVersion:null, loaded:{}, db:null, user:null, canWrite:true, assets:null, downloads:null, dbState:'wait',
  view:'dash', ui:{} };
const today=new Date(); today.setHours(0,0,0,0);
const TODAY_ISO=iso(today);

/* ============ Utils ============ */
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iso(d){if(!d)return'';const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pd(s){if(!s)return null;if(s instanceof Date)return s;const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3])}
function fd(s){const d=pd(s);if(!d)return'—';return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function days(a,b){return Math.round((pd(b)-pd(a))/86400000)}
const NF=new Intl.NumberFormat('en-US');
function fn(v){if(v==null||v===''||isNaN(v))return'—';return NF.format(v)}
function num(v){if(v==null||v==='')return null;const n=Number(String(v).replace(/[,،\s]/g,''));return isNaN(n)?null:n}
function norm(s){return (s||'').toString().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g,' ').trim().toLowerCase()}
function normNo(s){return norm(s).replace(/[\s.\/\\\-_]/g,'')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const GENERIC=new Set('شركه مصنع مصانع صناعه لصناعه للصناعات صناعات الصناعات انتاج لانتاج الانتاج تربيه لتربيه مقاولات للمقاولات المقاولات العامه عامه استثمار والاستثمار الاستثمار عقاري العقاري مواد البناء بناء الغذائيه غذائيه المواد و وشركاه وشركاؤه شركاؤه وشركاءه شركاءه مؤسسه اداره الخدمات خدمات ليبيه الليبيه الحديثه المتحده للتجاره تجاره والتجاره العالميه للخدمات وذبح وتسويق تسويق مشروبات المشروبات للمشروبات مصراته طرابلس زليتن بنغازي الخمس سرت سبها الزاويه صبراته غريان ترهونه ليبيا مشروع تنفيذ تاهيل تطوير تجهيز استكمال اعمال مجمع المجمع وحده صيد الصيد المسماه مزارع وصناعه والصناعات وتصنيع وتعليب'.split(' '));
function tokens(s){return norm(s).replace(/[^ء-يa-z0-9 ]/g,' ').split(' ').filter(Boolean).map(t=>t.replace(/^(وال|بال|لل|ال)/,'')).filter(t=>t.length>1&&!GENERIC.has(t)&&!GENERIC.has('ال'+t)&&!GENERIC.has('ل'+t))}
function nameMatch(a,b){const ta=tokens(a),tb=tokens(b);if(!ta.length||!tb.length||ta[0]!==tb[0])return 0;const A=new Set(ta),B=new Set(tb);let inter=0;A.forEach(t=>{if(B.has(t))inter++});const rmin=inter/Math.min(A.size,B.size),rmax=inter/Math.max(A.size,B.size);if(rmin<0.5||rmax<0.34)return 0;return 0.7+0.3*rmax}

function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}}
function uniq(arr){return [...new Set(arr.filter(v=>v!=null&&String(v).trim()!=='').map(v=>String(v).trim()))].sort((a,b)=>a.localeCompare(b,'ar'))}
function sumBy(arr,f){return arr.reduce((s,x)=>s+(Number(f(x))||0),0)}
function cleanRegion(r){return (r||'').toString().split(/[\/–\-]/)[0].trim()}

/* ============ Derived: contracts ============ */
function extsFor(c){const k=normNo(c.no);return S.extensions.filter(e=>normNo(e.contractNo)===k).sort((a,b)=>(a.newEnd||'').localeCompare(b.newEnd||''))}
function lettersFor(c){const k=normNo(c.no);return S.letters.filter(e=>normNo(e.contractNo)===k).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function derive(c){
  const ex=extsFor(c);let eff=c.endDate||'';ex.forEach(e=>{if(e.newEnd&&e.newEnd>eff)eff=e.newEnd});
  const st=S.settings;let status,remain=null;
  if(eff)remain=days(TODAY_ISO,eff);
  if(c.special)status=c.special;
  else if(c.startDate&&c.startDate>TODAY_ISO)status='لم يبدأ بعد';
  else if(eff&&eff<TODAY_ISO)status='منتهٍ';
  else if(eff&&remain<=st.t1)status='قريب الانتهاء';
  else if(eff)status='ساري';
  else status='غير محدد';
  let alert='';
  if(status==='ساري'||status==='قريب الانتهاء'){if(remain<=st.t3)alert='عاجل';else if(remain<=st.t2)alert='خلال 60 يوم';else if(remain<=st.t1)alert='خلال 90 يوم'}
  const dur=(c.startDate&&c.endDate)?Math.round(days(c.startDate,c.endDate)/30.4):null;
  let progress=null;if(c.startDate&&eff){const tot=days(c.startDate,eff);const el=days(c.startDate,TODAY_ISO);progress=Math.max(0,Math.min(1,el/(tot||1)))}
  return {effEnd:eff,status,remain,alert,dur,exts:ex.length,progress}
}
function statusPill(s){const m={'ساري':'p-ok','قريب الانتهاء':'p-warn','منتهٍ':'p-crit','لم يبدأ بعد':'p-info','معلق':'p-fl','منتهٍ قبل موعده':'p-neutral','غير محدد':'p-neutral'};return `<span class="pill ${m[s]||'p-neutral'}">${esc(s)}</span>`}
function alertPill(a){if(!a)return'';const m={'عاجل':'p-crit','خلال 60 يوم':'p-warn','خلال 90 يوم':'p-info'};return `<span class="pill ${m[a]}">${esc(a)}</span>`}
let D=new Map(); // contract id -> derived
let DUP=new Set();
let MATCH={byNeed:new Map(),byContract:new Map()};
function recompute(){
  D=new Map();S.contracts.forEach(c=>D.set(c.id,derive(c)));
  const seen=new Map();DUP=new Set();
  S.contracts.forEach(c=>{const k=normNo(c.no)+'|'+norm(c.company);if(!normNo(c.no))return;if(seen.has(k)){DUP.add(c.id);DUP.add(seen.get(k))}else seen.set(k,c.id)});
  MATCH={byNeed:new Map(),byContract:new Map()};
  const ct=S.contracts.filter(c=>!/السفن/.test(c.type||'')).map(c=>({c,t:c.company}));
  S.needs.forEach(n=>{let best=null,bs=0;ct.forEach(({c,t})=>{const s=nameMatch(n.company,t);if(s>bs){bs=s;best=c}});
    if(best&&bs>=0.62){MATCH.byNeed.set(n.id,best);if(!MATCH.byContract.has(best.id))MATCH.byContract.set(best.id,[]);MATCH.byContract.get(best.id).push(n)}});
}

    ${kpi(`تنتهي خلال ${S.settings.t3} يومًا`,w(S.settings.t3),'crit','تحتاج إجراء عاجل',"contracts",{st:'a30'})}

function filteredContracts(){
  const u=cUI();const q=norm(u.q);const qn=normNo(u.q);
  let rows=S.contracts.map(c=>({c,d:D.get(c.id)}));
  if(q)rows=rows.filter(({c})=>{const hay=norm([c.no,c.company,c.location,c.type,c.subject,c.qty,c.dept,c.officer,c.notes,c.party&&c.party.rep,c.party&&c.party.cr].join(' '));return hay.includes(q)||normNo(c.no).includes(qn)});
  if(u.st&&u.st!=='all'){rows=rows.filter(({d})=>u.st==='active'?(d.status==='ساري'||d.status==='قريب الانتهاء'):u.st==='a30'?(d.alert==='عاجل'):u.st==='a90'?!!d.alert:u.st==='منتهٍ'?(d.status==='منتهٍ'||d.status==='منتهٍ قبل موعده'):d.status===u.st)}
  if(u.type)rows=rows.filter(({c})=>c.type===u.type);

  if(u.loc)rows=rows.filter(({c})=>cleanRegion(c.location)===u.loc);
  const key={no:x=>parseInt((x.c.no||'').replace(/\D/g,''))||0,company:x=>x.c.company||'',location:x=>x.c.location||'',type:x=>x.c.type||'',sign:x=>x.c.signDate||'',start:x=>x.c.startDate||'',end:x=>x.d.effEnd||'',remain:x=>x.d.remain==null?1e9:x.d.remain,status:x=>x.d.status,value:x=>x.c.value||0,qty:x=>num(String(x.c.qty||'').replace(/[^\d.]/g,''))||0}[u.sort]||(x=>0);
  rows.sort((a,b)=>{const A=key(a),B=key(b);const r=typeof A==='number'?A-B:String(A).localeCompare(String(B),'ar');return u.dir==='asc'?r:-r});

function buildDir(){
  const ents=[];
  S.contracts.forEach(c=>{const p=c.party||{};ents.push({name:c.company,region:c.location,person:p.rep||'',phone:p.phone||'',contracts:[c],needs:[]})});
  S.companies.forEach(co=>{ents.push({name:co.name,region:co.address||'',person:co.person||'',phone:co.phone||'',email:co.email||'',contracts:[],needs:[],manual:co})});
  S.needs.forEach(n=>{const m=MATCH.byNeed.get(n.id);let e=m?ents.find(x=>x.contracts.includes(m)):null;if(!e)e=ents.find(x=>nameMatch(x.name,n.company)>=0.62);if(e){e.needs.push(n);if(!e.person)e.person=n.licensee||'';if(!e.activity)e.activity=n.activity}else ents.push({name:n.company,region:n.region,person:n.licensee||'',activity:n.activity,contracts:[],needs:[n]})});
  // merge contracts with same name
  const out=[];ents.forEach(e=>{const t=out.find(o=>nameMatch(o.name,e.name)>=0.8);if(t){t.contracts.push(...e.contracts);t.needs.push(...e.needs);t.person=t.person||e.person;t.phone=t.phone||e.phone}else out.push(e)});
  return out.sort((a,b)=>(b.contracts.length+b.needs.length)-(a.contracts.length+a.needs.length)||a.name.localeCompare(b.name,'ar'));
}

  S._dirRows=rows;

async function write(col,id,obj,isNew){

  if(act==='edit-role'){document.getElementById('u-email').value=a.dataset.e;document.getElementById('u-name').value=a.dataset.n;document.getElementById('u-role').value=a.dataset.r;document.getElementById('u-name').focus()}
  if(act==='save-role'){const m=document.getElementById('u-msg');const em=val('u-email').toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){m.style.color='var(--crit)';m.textContent='أدخل بريدًا إلكترونيًا صحيحًا';return}
    try{await FS.collection('roles').doc(em).set({name:val('u-name'),role:document.getElementById('u-role').value});await FS.collection('log').add({ts:new Date().toISOString(),user:window.__me().email,name:window.__me().name,action:'منح صلاحية',col:'roles',id:em,summary:val('u-name')+' ('+window.__roleAr[document.getElementById('u-role').value]+')'});m.style.color='var(--ok)';m.textContent='تم الحفظ. يستطيع المستخدم الدخول الآن ببريده.';['u-email','u-name'].forEach(i=>document.getElementById(i).value='');loadRoles();loadLog()}catch(err){m.style.color='var(--crit)';m.textContent=err.message}}
  if(act==='del-role'){if(!a.classList.contains('armed')){a.classList.add('armed');a.textContent='تأكيد الإزالة';setTimeout(()=>{a.classList.remove('armed');a.textContent='إزالة'},4000);return}try{await FS.collection('roles').doc(a.dataset.e).delete();loadRoles()}catch(err){toast(err.message)}}
});

</script>
</body>
</html>
